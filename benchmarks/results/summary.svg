<text class="title" x="28" y="46">TantivyDotNet vs Lucene.NET</text><text class="sub" x="28" y="68">215,778 English Wikipedia articles. Lower is better; bars are relative to Lucene.NET.</text><rect class="s1" x="28" y="84" width="12" height="12" rx="3"/><text class="legend" x="46" y="94">TantivyDotNet</text><rect class="s2" x="166.2" y="84" width="12" height="12" rx="3"/><text class="legend" x="184.2" y="94">Lucene.NET 4.8</text><line class="rule" x1="28" x2="772" y1="130" y2="130"/><text class="section" x="28" y="154">Indexing all articles (on disk, commit, close)</text><text class="label" x="28" y="189">1 thread</text><g><title>1 thread, TantivyDotNet: 7.3 s</title><path class="s1" d="M224,177H388.2Q392.2,177 392.2,181V187Q392.2,191 388.2,191H224Z"/><text class="value" x="400.2" y="188.5">7.3 s<tspan class="ratio" dx="8">2.1× faster</tspan></text></g><g><title>1 thread, Lucene.NET: 15.0 s</title><path class="s2" d="M224,193H565.2Q569.2,193 569.2,197V203Q569.2,207 565.2,207H224Z"/><text class="value" x="577.2" y="204.5">15.0 s</text></g><text class="label" x="28" y="241">4 threads</text><g><title>4 threads, TantivyDotNet: 3.7 s</title><path class="s1" d="M224,229H354.7Q358.7,229 358.7,233V239Q358.7,243 354.7,243H224Z"/><text class="value" x="366.7" y="240.5">3.7 s<tspan class="ratio" dx="8">2.6× faster</tspan></text></g><g><title>4 threads, Lucene.NET: 9.6 s</title><path class="s2" d="M224,245H565.2Q569.2,245 569.2,249V255Q569.2,259 565.2,259H224Z"/><text class="value" x="577.2" y="256.5">9.6 s</text></g><line class="axis" x1="224" x2="224" y1="172" y2="264"/><line class="rule" x1="28" x2="772" y1="288" y2="288"/><text class="section" x="28" y="312">Query: top 10 hits with stored fields, plus total count</text><text class="label" x="28" y="347">Term</text><text class="detail" x="28" y="364">science</text><g><title>Term, TantivyDotNet: 82 µs</title><path class="s1" d="M224,335H294.8Q298.8,335 298.8,339V345Q298.8,349 294.8,349H224Z"/><text class="value" x="306.8" y="346.5">82 µs<tspan class="ratio" dx="8">4.6× faster</tspan></text></g><g><title>Term, Lucene.NET: 377 µs</title><path class="s2" d="M224,351H565.2Q569.2,351 569.2,355V361Q569.2,365 565.2,365H224Z"/><text class="value" x="577.2" y="362.5">377 µs</text></g><text class="label" x="28" y="399">AND</text><text class="detail" x="28" y="416">american AND football</text><g><title>AND, TantivyDotNet: 121 µs</title><path class="s1" d="M224,387H278.2Q282.2,387 282.2,391V397Q282.2,401 278.2,401H224Z"/><text class="value" x="290.2" y="398.5">121 µs<tspan class="ratio" dx="8">5.9× faster</tspan></text></g><g><title>AND, Lucene.NET: 718 µs</title><path class="s2" d="M224,403H565.2Q569.2,403 569.2,407V413Q569.2,417 565.2,417H224Z"/><text class="value" x="577.2" y="414.5">718 µs</text></g><text class="label" x="28" y="451">OR</text><text class="detail" x="28" y="468">american OR football</text><g><title>OR, TantivyDotNet: 304 µs</title><path class="s1" d="M224,439H307.2Q311.2,439 311.2,443V449Q311.2,453 307.2,453H224Z"/><text class="value" x="319.2" y="450.5">304 µs<tspan class="ratio" dx="8">4.0× faster</tspan></text></g><g><title>OR, Lucene.NET: 1,204 µs</title><path class="s2" d="M224,455H565.2Q569.2,455 569.2,459V465Q569.2,469 565.2,469H224Z"/><text class="value" x="577.2" y="466.5">1,204 µs</text></g><text class="label" x="28" y="503">Phrase</text><text class="detail" x="28" y="520">&quot;united states&quot;</text><g><title>Phrase, TantivyDotNet: 3,786 µs</title><path class="s1" d="M224,491H577.3Q581.3,491 581.3,495V501Q581.3,505 577.3,505H224Z"/><text class="value" x="589.3" y="502.5">3,786 µs<tspan class="ratio" dx="8">4% slower</tspan></text></g><g><title>Phrase, Lucene.NET: 3,657 µs</title><path class="s2" d="M224,507H565.2Q569.2,507 569.2,511V517Q569.2,521 565.2,521H224Z"/><text class="value" x="577.2" y="518.5">3,657 µs</text></g><text class="label" x="28" y="555">Term, sorted</text><text class="detail" x="28" y="572">science, by a numeric field</text><g><title>Term, sorted, TantivyDotNet: 224 µs</title><path class="s1" d="M224,543H271.2Q275.2,543 275.2,547V553Q275.2,557 271.2,557H224Z"/><text class="value" x="283.2" y="554.5">224 µs<tspan class="ratio" dx="8">6.7× faster</tspan></text></g><g><title>Term, sorted, Lucene.NET: 1,511 µs</title><path class="s2" d="M224,559H565.2Q569.2,559 569.2,563V569Q569.2,573 565.2,573H224Z"/><text class="value" x="577.2" y="570.5">1,511 µs</text></g><line class="axis" x1="224" x2="224" y1="330" y2="578"/><line class="rule" x1="28" x2="772" y1="602" y2="602"/><text class="section" x="28" y="626">Index size</text><text class="label" x="28" y="661">On disk</text><text class="detail" x="28" y="678">171 MiB of text</text><g><title>On disk, TantivyDotNet: 192.4 MiB</title><path class="s1" d="M224,649H578Q582,649 582,653V659Q582,663 578,663H224Z"/><text class="value" x="590" y="660.5">192.4 MiB<tspan class="ratio" dx="8">4% larger</tspan></text></g><g><title>On disk, Lucene.NET: 185.5 MiB</title><path class="s2" d="M224,665H565.2Q569.2,665 569.2,669V675Q569.2,679 565.2,679H224Z"/><text class="value" x="577.2" y="676.5">185.5 MiB</text></g><line class="axis" x1="224" x2="224" y1="644" y2="684"/><line class="rule" x1="28" x2="772" y1="704" y2="704"/><text class="foot" x="28" y="726">Intel Core i5-1038NG7 CPU 2.00GHz · macOS Tahoe 26.5.2 (25F84) · .NET 10.0.0 · BenchmarkDotNet 0.15.8 · 2026-11-22</text>
