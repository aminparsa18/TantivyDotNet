name: Publish

# Push a tag like v0.1.0 or v0.2.0-preview.1 to publish that version to nuget.org.
# The whole CI pipeline (native builds, pack, tests + NativeAOT app on every platform) runs first,
# and the exact package it tested is the one pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    # Must match the Environment on the nuget.org trusted-publishing policy. Protection rules
    # (e.g. required reviewers) can be added to it under Settings -> Environments.
    environment: release
    permissions:
      contents: read
      id-token: write   # GitHub OIDC token, exchanged by NuGet/login for a short-lived API key
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: artifacts/packages

      - name: Check package version matches the tag
        run: |
          expected="artifacts/packages/TantivyDotNet.${GITHUB_REF_NAME#v}.nupkg"
          ls artifacts/packages
          if [ ! -f "$expected" ]; then
            echo "::error::expected $expected for tag $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      # Trusted publishing: no stored API key. NUGET_USER is the nuget.org account name (not the email)
      # that owns the trusted-publishing policy for this repository and publish.yml.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
