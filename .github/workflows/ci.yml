name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # publish.yml runs this whole pipeline for v* tags, then pushes the tested package.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # 0. Rust checks: formatting, lints and the crate's unit tests (runs alongside the builds).
  #    Also on Windows, whose file semantics the crate works around (directory.rs).
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version and components come from native/rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native
          key: checks

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      # --all-features includes `fuzzing` (the fuzz targets' entry points; fuzz.yml runs the fuzzers).
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Unit tests
        run: cargo test --all-features --locked

  # 0a. Supply chain: cargo-deny (licenses, RustSec advisories, crate sources, duplicates as
  #     warnings; native/deny.toml) and THIRD-PARTY-NOTICES.txt, which ships in the package and must
  #     match Cargo.lock (cargo-about; native/about.toml).
  licenses:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0,cargo-about@0.9.3

      - name: cargo deny
        run: cargo deny --locked check

      - name: THIRD-PARTY-NOTICES.txt is up to date
        run: |
          cargo fetch --locked
          cargo about generate --locked --offline about.hbs -o ../THIRD-PARTY-NOTICES.txt
          if ! git diff --exit-code -- ../THIRD-PARTY-NOTICES.txt; then
            echo "::error::THIRD-PARTY-NOTICES.txt is out of date; regenerate it (see native/about.toml)"
            exit 1
          fi

  # 0b. Code coverage of the .NET library (its test suite) and the Rust crate (its unit tests),
  #     reported in the job summary and as an HTML artifact. Not a gate.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        working-directory: native
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native
          key: coverage

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Rust coverage
        working-directory: native
        # cargo llvm-cov doesn't create the output directory.
        run: |
          mkdir -p ../coverage
          cargo llvm-cov --all-features --locked --cobertura --output-path ../coverage/rust.cobertura.xml

      # Builds the native library from source (Debug) and runs the whole suite against the project.
      - name: .NET coverage
        run: >
          dotnet test --project tests/TantivyDotNet.Tests -f net10.0 --
          --coverage --coverage-output-format cobertura --coverage-output dotnet.cobertura.xml
          --coverage-settings "$PWD/tests/coverage.xml" --results-directory "$PWD/coverage"

      - name: Report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.6.1
          reportgenerator -reports:"coverage/*.cobertura.xml" -targetdir:coverage/report \
            -reporttypes:"Html;MarkdownSummaryGithub" -title:TantivyDotNet
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/report/

  # 1. Build the Rust cdylib once per RID.
  native:
    name: native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is cross-compiled with cargo-zigbuild against glibc 2.17, so the library loads on
          # any distro from RHEL 7 / Ubuntu 16.04 / Debian 9 on, not just the runner's glibc.
          - { rid: linux-x64,   os: ubuntu-24.04,  target: x86_64-unknown-linux-gnu,  lib: libtantivy_dotnet.so,    glibc: '2.17' }
          - { rid: linux-arm64, os: ubuntu-24.04,  target: aarch64-unknown-linux-gnu, lib: libtantivy_dotnet.so,    glibc: '2.17' }
          - { rid: osx-arm64,   os: macos-15,      target: aarch64-apple-darwin,      lib: libtantivy_dotnet.dylib }
          - { rid: osx-x64,     os: macos-15,      target: x86_64-apple-darwin,       lib: libtantivy_dotnet.dylib }
          - { rid: win-x64,     os: windows-2025,  target: x86_64-pc-windows-msvc,    lib: tantivy_dotnet.dll }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        working-directory: native
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native
          key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.glibc
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet cargo-zigbuild==0.24.1 ziglang==0.17.1
          # The venv's python3 must come first: cargo-zigbuild finds zig via `python3 -m ziglang`.
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: native
        run: |
          if [ -n "${{ matrix.glibc }}" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}.${{ matrix.glibc }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Check glibc symbol versions
        if: matrix.glibc
        run: |
          max=$(objdump -T native/target/${{ matrix.target }}/release/${{ matrix.lib }} \
                | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "newest glibc symbol: $max"
          if [ "$(printf '%s\n' "$max" "${{ matrix.glibc }}" | sort -V | tail -1)" != "${{ matrix.glibc }}" ]; then
            echo "::error::library needs glibc $max, newer than the ${{ matrix.glibc }} baseline"
            exit 1
          fi

      # build.rs regenerates the C# bindings on every build; the committed copy must match.
      - name: Check NativeMethods.g.cs is up to date
        run: git diff --exit-code -- src/TantivyDotNet/Native/NativeMethods.g.cs

      # The release profile has line tables (native/Cargo.toml). They go into separate files, which
      # publish.yml attaches to the GitHub Release; the packed library keeps its symbol table only.
      #   Linux: DWARF -> <lib>.debug (+ .gnu_debuglink in the .so); macOS: dsymutil -> <lib>.dSYM,
      #   then strip -S; Windows: rustc already wrote tantivy_dotnet.pdb next to the dll.
      - name: Split debug symbols
        working-directory: native
        env:
          OUT: target/${{ matrix.target }}/release
          LIB: ${{ matrix.lib }}
          SYM: ../native-symbols/${{ matrix.rid }}
        run: |
          mkdir -p "$SYM"
          case "$RUNNER_OS" in
            Linux)
              objcopy="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-objcopy"
              "$objcopy" --only-keep-debug "$OUT/$LIB" "$SYM/$LIB.debug"
              "$objcopy" --strip-debug --add-gnu-debuglink="$SYM/$LIB.debug" "$OUT/$LIB"
              if readelf -S "$OUT/$LIB" | grep -q '\.debug_'; then
                echo "::error::$LIB still has .debug_* sections"
                exit 1
              fi
              ;;
            macOS)
              dsymutil "$OUT/$LIB" -o "$SYM/$LIB.dSYM"
              strip -S "$OUT/$LIB"
              ;;
            Windows)
              cp "$OUT/tantivy_dotnet.pdb" "$SYM/"
              ;;
          esac
          ls -l "$OUT/$LIB"
          du -sh "$SYM"/*

      - name: Stage
        run: |
          mkdir -p native-assets/${{ matrix.rid }}
          cp native/target/${{ matrix.target }}/release/${{ matrix.lib }} native-assets/${{ matrix.rid }}/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          path: native-assets/
          if-no-files-found: error

      # Not "native-*": the pack job downloads that pattern into the package's native assets.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symbols-${{ matrix.rid }}
          path: native-symbols/
          if-no-files-found: error

  # 2. Pack one package holding every RID's library.
  pack:
    needs: native
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: native-assets
          merge-multiple: true

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-ci.${{ github.run_number }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # SkipNativeBuild: no Rust here; the libraries come from the native jobs.
      - name: Pack
        run: >
          dotnet pack src/TantivyDotNet -c Release -o artifacts/packages
          -p:Version=${{ steps.version.outputs.version }}
          -p:SkipNativeBuild=true
          -p:NativeAssetsDir="$PWD/native-assets"
          -p:RequireAllNativeAssets=true

      - name: Package contents
        run: |
          unzip -l artifacts/packages/*.nupkg
          unzip -l artifacts/packages/*.snupkg

      # The .snupkg (portable PDBs + SourceLink) travels with the .nupkg; dotnet nuget push sends both.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  # 3. On every platform: run the test suite and a NativeAOT app against the packed package.
  test:
    name: test (${{ matrix.rid }})
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   os: ubuntu-24.04 }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64,   os: macos-15 }
          - { rid: osx-x64,     os: macos-15-intel }
          - { rid: win-x64,     os: windows-2025 }
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_PROPS: -p:TantivyPackageVersion=${{ needs.pack.outputs.version }} -p:TantivyPackageSource=${{ github.workspace }}/artifacts/packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # 10.0 for the net10.0 test run; global.json picks the SDK that builds.
          dotnet-version: 10.0.x
          global-json-file: global.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg
          path: artifacts/packages

      - name: NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang zlib1g-dev

      - name: Test (net10.0, net11.0)
        run: |
          # PACKAGE_PROPS holds several arguments: word splitting is intended.
          # shellcheck disable=SC2086
          dotnet test --project tests/TantivyDotNet.Tests -c Release $PACKAGE_PROPS

      - name: Publish NativeAOT smoke app
        run: |
          # shellcheck disable=SC2086
          dotnet publish tests/TantivyDotNet.AotSmoke -c Release -r ${{ matrix.rid }} -o aot $PACKAGE_PROPS

      - name: Run NativeAOT smoke app
        run: ./aot/TantivyDotNet.AotSmoke
