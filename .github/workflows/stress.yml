name: Stress

# Runs the concurrency stress and leak tests for minutes instead of seconds (TDN_STRESS_SECONDS),
# weekly and on demand. The regular CI runs them briefly on every push.
on:
  schedule:
    - cron: '41 4 * * 1'   # Mondays, 04:41 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per stress test
        default: '120'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  stress:
    name: stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version comes from native/rust-toolchain.toml.
      - name: Rust toolchain
        working-directory: native
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      # Release: the native library is built optimized, as shipped.
      - name: Stress and leak tests
        env:
          TDN_STRESS_SECONDS: ${{ inputs.seconds || '120' }}
        run: >
          dotnet test --project tests/TantivyDotNet.Tests -c Release -f net10.0 --
          --filter-class TantivyDotNet.Tests.StressTests --filter-class TantivyDotNet.Tests.LeakTests
