# cargo-about: generates ../THIRD-PARTY-NOTICES.txt, the license texts of every crate compiled
# into the native library, shipped in the NuGet package. Regenerate after dependency changes:
#   cd native && cargo fetch --locked && cargo about generate --locked --offline about.hbs -o ../THIRD-PARTY-NOTICES.txt
# CI (job `licenses`) fails when the committed file is out of date. Keep `accepted` in step with
# deny.toml's [licenses] allow list.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
# The shipped RIDs (dependencies used only on other platforms are left out).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# csbindgen and the other build-time crates aren't part of the library.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Our own crate is covered by the package's MIT license.
private = { ignore = true }
