[package]
name = "tantivy_dotnet"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
# rlib too, so examples/ (the native timing harness) can call the search code directly.
crate-type = ["cdylib", "rlib"]

[features]
# Exposes `fuzzing`, the entry points of the fuzz targets in fuzz/ (not part of the C ABI).
fuzzing = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tantivy = { version = "0.27", features = ["zstd-compression"] }

[build-dependencies]
csbindgen = "1.9.8"

[profile.release]
lto = true
codegen-units = 1
# Line tables (function names, files, lines) for symbolicating native crashes. They stay out of the
# shipped library: with the default split-debuginfo, Windows writes a .pdb and macOS a .dSYM; on
# Linux CI moves the DWARF of the .so into a .debug file (llvm-objcopy). They're attached to the
# GitHub Release, not the package.
debug = "line-tables-only"
