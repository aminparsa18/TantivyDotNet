[package]
name = "tantivy_dotnet"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# rlib too, so examples/ (the native timing harness) can call the search code directly.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tantivy = { version = "0.27", features = ["zstd-compression"] }

[build-dependencies]
csbindgen = "1.9.8"

[profile.release]
lto = true
codegen-units = 1
